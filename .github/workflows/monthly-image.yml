# 每月 1 日构建运行时镜像，并追 Codex / DSH 的 npm latest。
# Claude、Node.js、Git 不会自动加版本。新的 install 脚本会让构建失败，需人工写入 approvedScripts。
name: Monthly image

on:
  schedule:
    # 每月 1 日 00:00 UTC（北京时间 08:00）。只在默认分支生效。
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: monthly-image
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift
          sudo apt-get clean
          df -h

      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        env:
          MISE_LOCKED: '1'
        with:
          cache: true

      - name: Install builder dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check and test
        run: |
          npm run check
          npm test
          npm run validate

      - name: Add latest Codex and DSH versions
        run: npm run add-latest -- --config-only

      - name: Build mirror cache
        run: npm run build:mirror

      - name: Save resource lock
        run: cp dist/mirror-lock.json mirror-lock.json

      - name: Commit version and lock updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mirror.yaml mirror-lock.json
          if git diff --staged --quiet; then
            echo 'No configuration or lock changes.'
            exit 0
          fi
          git commit -m "chore: monthly tool versions $(date -u +%Y-%m-%d)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Drop work cache
        run: |
          rm -rf .mirror-work node_modules
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          set -euo pipefail
          TAG="$(date -u +%Y%m%d)"
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.prebuilt \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.title=agent-mirror" \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${TAG} and ${IMAGE}:latest"
